<!doctype html>
<html lang="ja" data-theme="paper" data-font="mincho">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#23211c">
<title>ポメラタブ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <button data-cmd="files" title="ファイル（Alt+O）">☰</button>
    <button class="doc-title" id="docTitle" data-cmd="rename" title="名前を変更"></button>
    <div class="spacer"></div>
    <button data-cmd="outline" class="hide-sm" title="アウトライン（Alt+L）">目次</button>
    <button data-cmd="dict" title="辞書（Alt+D）">辞書</button>
    <button data-cmd="find" class="hide-sm" title="検索・置換（Ctrl+F）">検索</button>
    <button data-cmd="proof" id="btnProof" class="hide-sm" title="校正モード（F7）">校正</button>
    <button data-cmd="vertical" id="btnVertical" class="hide-sm" title="縦書き／横書き（Alt+V）">縦</button>
    <button data-cmd="preview" id="btnPreview" class="hide-md" title="ルビ・縦中横の確認（Alt+P）">表示</button>
    <button data-cmd="focus" class="hide-md" title="集中モード（Alt+Z）">集中</button>
    <button data-cmd="sync" id="btnSync" title="保存して同期（Ctrl+S）">同期</button>
    <button data-cmd="settings" class="hide-sm" title="設定（Alt+,）">⚙</button>
    <button data-cmd="more" class="more-btn" title="その他のメニュー">⋯</button>
  </header>
  <div id="reveal"></div>
  <main class="stage" id="stage">
    <div id="proofLayer" class="proof-layer" aria-hidden="true" hidden></div>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="本文"></textarea>
    <div id="preview" class="preview" tabindex="0" hidden></div>
  </main>
  <footer class="statusbar" id="statusbar">
    <div id="goalBar"></div>
    <span id="stChars"></span>
    <span id="stPages"></span>
    <span id="stToday"></span>
    <span id="stGoal"></span>
    <span id="stProof" class="st-proof" hidden></span>
    <span class="spacer"></span>
    <span id="stSave"></span>
    <span id="stSync"></span>
    <span id="stBattery"></span>
    <span id="stClock"></span>
  </footer>
  <aside id="panel" class="panel" hidden></aside>
  <section id="dictView" class="dv" hidden></section>
</div>
<dialog id="dialog"></dialog>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
